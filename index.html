<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Club</title>
<meta name="description" content="Meeting guides for our book club: agenda, chapter recaps and discussion questions.">
<meta property="og:title" content="Book Club">
<meta property="og:description" content="Meeting guides for our book club: agenda, chapter recaps and discussion questions.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2c5d4c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%232c5d4c%27/%3E%3Cpath d=%27M14 18c6-3 12-3 18 1v29c-6-4-12-4-18-1z%27 fill=%27%23fff%27/%3E%3Cpath d=%27M50 18c-6-3-12-3-18 1v29c6-4 12-4 18-1z%27 fill=%27%23e3efe9%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root {
  /* Layout: settings column beside a reading column on wide screens; one column on phones. */
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202a;
  --muted: #5a6571;
  --line: #d9dfe5;
  --accent: #2c5d4c;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe9;
  --mark: #f3dc8e;
  --warn: #8a5a00;
  --warn-soft: #fbf1d9;
  --danger: #a3302a;
  --star: #85600f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b;
    --surface: #182027;
    --ink: #e7ecf1;
    --muted: #9aa6b2;
    --line: #2b3640;
    --accent: #79c3a6;
    --accent-ink: #0d1a15;
    --accent-soft: #1d2f29;
    --mark: #5a4a17;
    --warn: #f0c46a;
    --warn-soft: #2e2614;
    --danger: #f08b84;
  --star: #e2b453;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b;
  --surface: #182027;
  --ink: #e7ecf1;
  --muted: #9aa6b2;
  --line: #2b3640;
  --accent: #79c3a6;
  --accent-ink: #0d1a15;
  --accent-soft: #1d2f29;
  --mark: #5a4a17;
  --warn: #f0c46a;
  --warn-soft: #2e2614;
  --danger: #f08b84;
  --star: #e2b453;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; line-height: 1.2; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1180px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { font-family: var(--font-display); font-size: 20px; font-weight: 650; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.layout.member { grid-template-columns: minmax(0, 820px); justify-content: center; }
.layout.member .form { display: none; }

.livebar { background: var(--accent); color: var(--accent-ink); }
.livebar[hidden] { display: none; }
.livebar-inner { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
#livebar-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livebar .dot { flex: none; }
.livebar .btn { flex: none; }
@media (max-width: 520px) {
  .top-inner { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .tabs { width: 100%; margin-left: 0; }
  .tab { flex: 1; text-align: center; }
  .brand { font-size: 17px; white-space: nowrap; }
  .brand-rest { display: none; }
  .tab { padding: 6px 11px; font-size: 13px; }
  .livebar-inner { padding: 6px 12px; }
  .livebar-meta { display: none; }
}
.livebar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); animation: pulse 1.4s ease-in-out infinite; }
.livebar .btn { background: transparent; color: var(--accent-ink); border-color: currentColor; padding: 4px 10px; font-size: 13px; }

.banner { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 70ch; }
.sec { scroll-margin-top: calc(var(--sticky, 120px) + 12px); transition: box-shadow .2s, border-color .2s; }
.sec.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sec-head .tag-now { font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 2px 8px; border-radius: 999px; }
.sec-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.card.current { border-color: var(--accent); }
.follow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.form { display: grid; gap: 14px; position: sticky; top: calc(var(--sticky, 64px) + 12px); }
@media (max-width: 860px) {
  .form { position: static; }
  /* On phones the host sees the meeting first; the planning form sits below it. */
  .layout:not(.member):not(.empty) .guide { order: -1; }
}
.form h2 { font-size: 18px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper);
}
.field textarea { min-height: 76px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.status { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status[hidden] { display: none; }

/* Guide */
.guide { display: grid; gap: 18px; }
.guide-head { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.chip.example { background: var(--mark); color: var(--ink); }
.chip.unsaved { background: var(--warn-soft); color: var(--warn); }
.guide-head h1 { font-size: clamp(26px, 4vw, 34px); }
.lead { margin: 0; max-width: 65ch; color: var(--muted); }
.accuracy { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); max-width: 70ch; }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 20px; display: grid; gap: 12px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; }
.sec-head h2 { font-size: 21px; }
.sec.busy { opacity: .6; }

.agenda { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.agenda th, .agenda td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.agenda th { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.agenda td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.scroll { overflow-x: auto; }

.chapters { display: grid; gap: 12px; }
.ch { display: grid; grid-template-columns: 52px 1fr; gap: 12px; }
.ch-num { font-family: var(--font-display); font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); border-radius: 8px; height: 40px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.ch h3 { font-size: 16px; margin-bottom: 2px; }
.ch p { margin: 0; max-width: 68ch; }
.ch ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 68ch; }

.items { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.items li { padding-left: 14px; border-left: 3px solid var(--line); max-width: 70ch; }
.items b { display: block; }
.spoiler { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--muted); font-size: 14.5px; max-width: 70ch; }
.spoiler summary { cursor: pointer; font-weight: 700; }

/* Saved */
.saved { display: grid; gap: 12px; }
.saved-group h2 { font-size: 20px; margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .title { font-weight: 700; }
.empty { color: var(--muted); }

.dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog-backdrop[hidden] { display: none; }
.dialog { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; display: grid; gap: 14px; border: 1px solid var(--line); }
.dialog h3 { font-size: 18px; }

.thinking { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }

/* Edit mode */
.editable { outline: 1px dashed var(--muted); outline-offset: 2px; border-radius: 4px; cursor: text; min-width: 3ch; }
.editable:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
.editable:empty::before { content: "Type here"; color: var(--muted); }
.items li > span.editable { display: block; margin-top: 4px; }
.rm { font-size: 12.5px; color: var(--danger); padding: 2px 4px; }
.items li.add { border-left-color: transparent; padding-left: 0; }
ul.plain { list-style: none; padding: 0; margin: 4px 0; display: grid; gap: 6px; }
.edit-bar { flex-direction: column; align-items: flex-start; }
.edit-bar input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.when { margin: 0; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.panel.export { display: grid; gap: 10px; margin-bottom: 8px; border-color: var(--accent); }

/* Print: a clean handout, always light, no app chrome. */
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --paper: #ffffff; --surface: #ffffff; --ink: #000000; --muted: #444444; --line: #cccccc;
    --accent: #2c5d4c; --accent-ink: #ffffff; --accent-soft: #eef4f1; color-scheme: light;
  }
  body { background: #fff; font-size: 11.5pt; }
  .top, .livebar, .actions, .sec-tools, .banner, .follow, #status, .form, #pub-footer, .tag-now, #view-saved { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .layout, .layout.member { display: block; }
  .guide { gap: 10pt; }
  .sec { border: 0; box-shadow: none; padding: 0; border-radius: 0; }
  .sec h2 { break-after: avoid; font-size: 15pt; }
  .ch, .items li, .agenda tr { break-inside: avoid; }
  .chip { border: 1px solid #ccc; }
  .spoiler { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
@page { margin: 0.6in; }
.edit-fields { display: flex; flex-wrap: wrap; gap: 10px; }
.edit-fields label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.edit-fields input { width: 9.5em; }
.edit-fields input[type="number"] { width: 6.5em; }
.panel.export a { color: var(--accent); }

/* ---------- Club features ---------- */
/* Typographic covers: a hue per title, no images needed. */
.cover { --hue: 160; flex: none; width: 72px; height: 104px; border-radius: 4px 8px 8px 4px; padding: 8px 7px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(90deg, hsl(var(--hue) 30% 22%) 0 6px, hsl(var(--hue) 38% 34%) 6px); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); overflow: hidden; }
.cover-title { font-family: var(--font-display); font-size: 11px; font-weight: 650; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cover-author { font-size: 8.5px; opacity: .85; line-height: 1.2; }
.cover.sm { width: 48px; height: 70px; padding: 5px; }
.cover.sm .cover-title { font-size: 8px; -webkit-line-clamp: 4; } .cover.sm .cover-author { display: none; }
.cover.xs { width: 30px; height: 44px; padding: 3px; } .cover.xs .cover-title, .cover.xs .cover-author { display: none; }

.book-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.book-head h2 { font-size: 20px; margin: 0; }
.chip.next { background: var(--accent); color: var(--accent-ink); }
.chip.done { background: var(--line); color: var(--ink); }
.chip.planned { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.card .chips { gap: 4px; }
.card.planned { border-style: dashed; cursor: default; }

.meet-actions { margin-top: 2px; }
details.cal { position: relative; }
details.cal > summary { list-style: none; }
details.cal > summary::-webkit-details-marker { display: none; }
.cal-menu { position: absolute; z-index: 4; top: calc(100% + 6px); left: 0; min-width: 220px; display: grid; gap: 2px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
.cal-menu .btn { justify-content: flex-start; padding: 8px 10px; width: 100%; text-decoration: none; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }

.shield { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; color: var(--muted); }
.shield select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-weight: 500; color: var(--ink); }
.ch.shielded .ch-num { background: var(--line); color: var(--muted); }

.club { display: grid; gap: 16px; }
.shelf-head { display: grid; gap: 8px; }
.shelf-head h1 { font-size: clamp(26px, 4vw, 34px); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.shelf-item { display: flex; gap: 12px; align-items: flex-start; }
.shelf-item > div { display: grid; gap: 3px; min-width: 0; }
.shelf-item .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { color: var(--star); letter-spacing: 1px; font-size: 15px; }
.rating-num { color: var(--muted); font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.verdict { font-style: italic; }

.club-editors { display: grid; gap: 16px; }
.club-editors .field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.club-editors .field .hint { font-weight: 400; }
.club-editors input, .club-editors select, .club-editors textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-weight: 500; color: var(--ink); }
.club-editors textarea { min-height: 64px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plan-rows { display: grid; gap: 10px; }
.plan-row { display: grid; grid-template-columns: 2fr 0.8fr 1fr 1.2fr 1fr 1.2fr auto; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.plan-row.shelf-edit { grid-template-columns: 2fr auto 1fr 2.5fr; align-items: center; }
.plan-row.upnext { grid-template-columns: 2fr 1.5fr auto; }
.book-mini { display: flex; gap: 8px; align-items: center; min-width: 0; }
.club-actions { position: sticky; bottom: 0; padding: 10px 0; background: var(--paper); }
.preview-label { font-size: 15px; color: var(--muted); font-family: var(--font-body); margin-top: 8px; }
.preview { display: grid; gap: 16px; padding: 16px; border: 2px dashed var(--line); border-radius: 16px; }
@media (max-width: 860px) {
  .plan-row, .plan-row.shelf-edit, .plan-row.upnext { grid-template-columns: 1fr 1fr; }
  .plan-row .rm { justify-self: start; }
  .grid2 { grid-template-columns: 1fr; }
}
@media print { .meet-actions, .shield, .cal-menu { display: none !important; } }

#saved-list { display: grid; gap: 28px; }
#club-root { display: grid; gap: 16px; }
.view-title { font-size: clamp(24px, 4vw, 30px); }
</style>
</head>
<body>
<template id="shell">
<header class="top">
  <div class="top-inner">
    <div class="brand">Book Club <span class="brand-rest">Meeting Planner</span></div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button class="tab" id="tab-plan" role="tab" aria-selected="true" aria-controls="view-plan" tabindex="0">Plan a meeting</button>
      <button class="tab" id="tab-saved" role="tab" aria-selected="false" aria-controls="view-saved" tabindex="-1">Saved meetings <span id="saved-count"></span></button>
      <button class="tab" id="tab-club" role="tab" aria-selected="false" aria-controls="view-club" tabindex="-1">Club</button>
    </div>
  </div>
  <div class="livebar" id="livebar" hidden>
    <div class="livebar-inner">
      <span class="dot" aria-hidden="true"></span>
      <span id="livebar-text">Now discussing</span>
      <button class="btn" id="livebar-jump" type="button">Jump there</button>
      <button class="btn" id="livebar-stop" type="button" hidden>End</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status" hidden style="margin-bottom:16px"></div>
  <section id="view-plan" class="layout" role="tabpanel" aria-labelledby="tab-plan">
    <form id="form" class="panel form" autocomplete="off">
      <h2>Plan a new meeting</h2>
      <p class="hint" id="form-hint">Filled in with the next chapters. Change anything, then tap Write the guide.</p>
      <div class="field">
        <label for="f-book">Book title</label>
        <input id="f-book" required placeholder="e.g. The Hobbit">
      </div>
      <div class="field">
        <label for="f-author">Author</label>
        <input id="f-author" placeholder="e.g. J.R.R. Tolkien">
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-chapters">Chapters</label>
          <input id="f-chapters" required placeholder="e.g. 1–5">
        </div>
        <div class="field">
          <label for="f-number">Meeting #</label>
          <input id="f-number" type="number" min="1" value="1">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-minutes">Length</label>
          <select id="f-minutes">
            <option value="60">60 min</option>
            <option value="90" selected>90 min</option>
            <option value="120">120 min</option>
          </select>
        </div>
        <div class="field">
          <label for="f-date">Meeting date</label>
          <input id="f-date" type="date">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-time">Start time</label>
          <input id="f-time" type="time" value="19:00">
        </div>
        <div class="field">
          <label for="f-type">Meeting type</label>
          <select id="f-type">
            <option value="chapters" selected>Chapters</option>
            <option value="wrapup">Final wrap-up</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-notes">Notes about your group</label>

// ---------- Export ----------
function toMarkdown(m) {
  const g = m.guide, L = [];
  L.push(`# ${m.book} — Meeting ${m.meetingNumber} (Ch. ${m.chapters})`);
  const sub = [m.author, m.date, m.time ? fmtTime(m.time) : "", `${m.minutes} minutes`].filter(Boolean).join(" · ");
  if (sub) L.push("", sub);
  if (g.lead) L.push("", g.lead);
  if (g.agenda.length) { L.push("", "## Agenda", "", "| Time | Segment | What happens |", "| --- | --- | --- |"); g.agenda.forEach(a => L.push(`| ${a.time} | ${a.segment} | ${a.details} |`)); }
  if (g.recap.length) { L.push("", "## Chapter recap"); g.recap.forEach(r => L.push("", `**Ch. ${r.chapter}${r.title ? ": " + r.title : ""}** — ${r.summary}`)); }
  if (g.icebreakers.length) { L.push("", "## Icebreakers", ""); g.icebreakers.forEach(i => L.push(`- **${i.title}:** ${i.prompt}`)); }
  if (g.chapterQuestions.length) { L.push("", "## Discussion questions"); g.chapterQuestions.forEach(c => { L.push("", `### Chapter ${c.chapter}${c.title ? ": " + c.title : ""}`, ""); c.questions.forEach((q, i) => L.push(`${i + 1}. ${q}`)); }); }
  if (g.themes.length) { L.push("", "## Big-picture talking points", ""); g.themes.forEach(t => L.push(`- **${t.title}.** ${t.prompt}`)); }
  if (g.context.length) { L.push("", "## Interesting context", ""); g.context.forEach(c => L.push(`- **${c.title}.** ${c.detail}`)); }
  if (g.spoilerNote) L.push("", `> **Spoiler box (only if everyone has read further):** ${g.spoilerNote}`);
  if (g.adaptations.length) { L.push("", "## Film, TV and stage", ""); g.adaptations.forEach(a => L.push(`- **${a.title}.** ${a.detail}`)); }
  const w = g.wrapUp;
  if (w.predictions.length || w.nextReading || w.bring) {
    L.push("", "## Wrap-up", "");
    w.predictions.forEach(p => L.push(`- Prediction: ${p}`));
    if (w.nextReading) L.push(`- Next reading: ${w.nextReading}`);
    if (w.bring) L.push(`- Bring next time: ${w.bring}`);
  }
  return L.join("\n") + "\n";
}
function fileName(m) {
  return (`${m.book}-meeting-${m.meetingNumber}`).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md";
}
function toPlainText(m) {
  const g = m.guide, L = [];
  const head = `${m.book}: meeting ${m.meetingNumber}, chapters ${m.chapters}`;
  L.push(head.toUpperCase());
  if (m.date) L.push(whenText(m.date, m.time).split(" · ").slice(0, m.time ? 2 : 1).join(" · "));
  if (g.lead) L.push("", g.lead);

  if (g.agenda.length) { section("Agenda"); g.agenda.forEach(a => L.push(`${a.time}  ${a.segment}${a.details ? ": " + a.details : ""}`)); }
  if (g.recap.length) { section("Chapter recap"); g.recap.forEach(r => L.push(`Ch. ${r.chapter}${r.title ? " (" + r.title + ")" : ""}: ${r.summary}`)); }
  if (g.icebreakers.length) { section("Icebreakers"); g.icebreakers.forEach(i => L.push(`- ${i.title}: ${i.prompt}`)); }
  if (g.chapterQuestions.length) { section("Discussion questions"); g.chapterQuestions.forEach(c => { L.push(`Ch. ${c.chapter}${c.title ? " (" + c.title + ")" : ""}`); c.questions.forEach((q, i) => L.push(`  ${i + 1}. ${q}`)); }); }

  if (g.context.length) { section("Interesting context"); g.context.forEach(c => L.push(`- ${c.title}: ${c.detail}`)); }
  if (g.adaptations.length) { section("Film, TV and stage"); g.adaptations.forEach(x => L.push(`- ${x.title}: ${x.detail}`)); }

}

          el("option", { value: "chapters", selected: p.type !== "wrapup" }, "Chapters"), el("option", { value: "wrapup", selected: p.type === "wrapup" }, "Final wrap-up"))),

      el("datalist", { id: "book-list" }, books.map(b => el("option", { value: b.book }))),

// ---------- Saved list ----------
const SITE_URL = "https://rico9267.github.io/bookclub/";
// The public copy of the data: no live section, no host notes about the group.
function publicData(data) {
  const d = JSON.parse(JSON.stringify(data));
  d.club = { currentId: obj(d.club).currentId || "", now: "" };
  d.meetings = d.meetings.map(({ notes, ...m }) => m);
  d.public = true;
  return d;
}
// Private mirror for the daily site sync: one record per meeting, so a sync only fetches what changed.
// Owner-only (db rules), never shown on the page. A failed or slow mirror never blocks a save.
async function mirrorToDb(data) {
  if (!S.db || !S.isHost) return;
  const pub = publicData(data);
  const metaRef = S.db.doc("pub/meta");
  const snap = await metaRef.get();
  const prev = snap.exists ? obj(snap.data()) : {};
  const stamps = Object.fromEntries(arr(prev.meetings).map(x => [x.id, x.updatedAt]));
  for (const m of pub.meetings) if (stamps[m.id] !== m.updatedAt) await S.db.doc("pubmeetings/" + m.id).set(m);
  for (const id of Object.keys(stamps)) if (!pub.meetings.some(m => m.id === id)) await S.db.doc("pubmeetings/" + id).delete();
  const meta = { currentId: pub.club.currentId, settings: pub.settings, schedule: pub.schedule, shelf: pub.shelf,
                 meetings: pub.meetings.map(m => ({ id: m.id, updatedAt: m.updatedAt })) };
  const same = JSON.stringify({ ...prev, mirroredAt: undefined }) === JSON.stringify({ ...meta, mirroredAt: undefined });
  if (!same) await metaRef.set({ ...meta, mirroredAt: new Date().toISOString() });
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
function publicHtml() {
  const d = publicData(cloneData());
  d.exportedAt = new Date().toISOString();
  // Members see the club's name, not the host tool's (first match = the <head> title).
  const name = (d.settings.clubName.trim() || "Book Club").replace(/[<>&"]/g, "");
  return buildHtml(d).replace("<title>Book Club Meeting Planner</title>", `<title>${name}</title>`).replace('<meta property="og:title" content="Book Club">', `<meta property="og:title" content="${name}">`);
}
async function exportPublic(btn) {
  if (!meetings().length) { setStatus("Save at least one meeting first.", true); return; }
  const html = publicHtml();
  if (S.downloads) {
    try { await S.downloads.save({ filename: "index.html", data: html }); setStatus("Downloaded index.html. Upload it to the bookclub repo on GitHub to update the public site."); return; }
    catch {}
  }
  try { await navigator.clipboard.writeText(html); btn.textContent = "Copied page code"; setStatus("Page code copied. Paste it into a file named index.html, then upload it to your host."); }
  catch { setStatus("Couldn't download or copy the page here. Try again from the Claude app on a computer.", true); }
}
function exportPanel() {
  if (!S.isHost || PUBLIC) return null;
  return el("div", { class: "panel export" },
    el("h2", { style: "font-size:18px" }, "Your club's public site"),
    el("p", { style: "margin:0;font-weight:700" }, el("a", { href: SITE_URL, target: "_blank", rel: "noopener" }, SITE_URL.replace("https://", ""))),
    el("p", { class: "hint", style: "font-size:14px;margin:0" },
      "Anyone can open this link with no account. It doesn't update by itself: after you save or edit a meeting, ask Claude to \u201cupdate the book club site,\u201d or download the page and upload it to the bookclub repo on GitHub (Add file \u2192 Upload files). The public copy is read-only and leaves out your notes about the group."),
    el("div", { class: "actions" },
      el("button", { class: "btn", type: "button", onclick: (e) => exportPublic(e.currentTarget) }, "Download public page")));
}
function renderFooter() {
  if (!PUBLIC || $("pub-footer")) return;
  document.querySelector(".brand-rest")?.remove();
  const when = S.data.exportedAt ? new Date(S.data.exportedAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  document.querySelector("main").append(el("p", { class: "hint", id: "pub-footer", style: "margin-top:24px;text-align:center" },
    when ? `Updated ${when}. Refresh for the latest guide.` : "Refresh for the latest guide."));
}

function openMeeting(m, opts = {}) {
  S.editing = false;
  S.current = { ...m, guide: normalizeGuide(m.guide) };
  S.isExample = false; S.unsaved = false;
  ss.set("bc-viewing", m.id);
  if (!S.isHost) { S.follow = m.id === club().currentId; ss.set("bc-follow", S.follow ? "1" : "0"); }
  if (S.isHost && !opts.keepForm) fillForm(m);
  setStatus("");
  renderGuide();
  showView("plan");
  window.scrollTo(0, 0);
}

const VIEWS = ["plan", "saved", "club"];
let currentView = "plan";
function showView(v) {
  currentView = v;
  for (const k of VIEWS) {
    $("view-" + k).hidden = k !== v;
    $("tab-" + k).setAttribute("aria-selected", k === v);
    $("tab-" + k).tabIndex = k === v ? 0 : -1;
  }
  if (v === "saved") renderSaved();
  if (v === "club") renderClub();
}
function applyRole() {
  $("view-plan").classList.toggle("member", !S.isHost);
  $("tab-plan").textContent = S.isHost ? "Plan a meeting" : "This meeting";
  $("tab-saved").firstChild.textContent = S.isHost ? "Meetings " : "Schedule ";
  $("tab-club").textContent = S.isHost ? "Club" : "Bookshelf";
  document.querySelector(".brand").firstChild.textContent = S.isHost ? "Book Club " : clubName() + " ";
  const rest = document.querySelector(".brand-rest"); if (rest) rest.hidden = !S.isHost;
  if (currentView === "club") renderClub();
}
for (const k of VIEWS) $("tab-" + k).onclick = () => showView(k);
document.querySelector(".tabs").addEventListener("keydown", (e) => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const i = VIEWS.indexOf(currentView);
  const to = e.key === "Home" ? 0 : e.key === "End" ? VIEWS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length;
  showView(VIEWS[to]);
  $("tab-" + VIEWS[to]).focus();
});
$("form").addEventListener("submit", generate);
$("btn-stop").onclick = () => S.ctl?.abort();

// Keep jump targets and the sticky form below the real header height (it changes with the live bar).
{
  const top = document.querySelector(".top");
  const setSticky = () => document.documentElement.style.setProperty("--sticky", top.getBoundingClientRect().height + "px");
  setSticky();
  if (window.ResizeObserver) new ResizeObserver(setSticky).observe(top);
}

// ---------- Start: render from the embedded data right away ----------
function pickInitial() {
  const list = meetings();
  const cur = list.find(x => x.id === club().currentId);
  const viewing = list.find(x => x.id === ss.get("bc-viewing"));
  const m = (!S.follow && viewing) ? viewing : (cur || viewing || list[0]);
  if (m) { S.current = { ...m, guide: normalizeGuide(m.guide) }; S.isExample = false; fillNext(m); }
  else {
    // Nothing saved yet: no fake example. Members see a short note, the host sees the form first.
    S.current = null; S.isExample = false;
    fillForm({ meetingNumber: 1, minutes: 90 });
    $("form-hint").textContent = "Enter your book and the chapters for the first meeting, then tap Write the guide.";
  }
  S.unsaved = false;
}
pickInitial();
applyRole();
renderGuide(); renderSaved(); renderLivebar();
{
  const msg = ss.get("bc-msg"); if (msg) { setStatus(msg); ss.del("bc-msg"); }
}
if (club().now && isCurrentMeeting() && S.follow) setTimeout(() => scrollToSection(club().now), 120);

(async () => {
  if (PUBLIC || !window.claude?.use) { renderFooter(); return; }   // plain public view: read-only, nothing else to load
  const [artifact, user, sample, downloads, db] = await Promise.all([
    claude.use("artifact").catch(() => null), claude.use("user").catch(() => null),
    claude.use("sample").catch(() => null), claude.use("downloads").catch(() => null), claude.use("db").catch(() => null)
  ]);
  S.artifact = artifact; S.user = user; S.sample = sample; S.downloads = downloads; S.db = db;

  let edit = null, owner = null;
  if (user) {
    try { edit = await user.canEdit(); } catch {}
    try { owner = await user.isOwner(); } catch {}
  }
  // Host = the owner or an editor. Everyone else gets the read-only club view.
  S.isHost = edit === true || owner === true || (user && edit == null && owner == null && !!sample);

  if (S.isHost) {
    // Restore an unsaved draft that a page update would otherwise have wiped.
    const draft = ss.get("bc-draft");
    if (draft) {
      try { S.current = { ...JSON.parse(draft) }; S.current.guide = normalizeGuide(S.current.guide); S.isExample = false; S.unsaved = true; fillForm(S.current); } catch { ss.del("bc-draft"); }
    }
    if (!sample) { $("btn-generate").disabled = true; $("ai-hint").textContent = "Claude isn't available in this view, so new guides can't be written."; }
  }
  applyRole();
  if (S.isHost) showUndo();   // offer Undo again after the page reloads from a delete
  if (S.isHost && S.db) withTimeout(mirrorToDb(S.data), 15000).catch(() => {});   // keep the sync copy current
  renderGuide(); renderSaved(); renderLivebar();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Relations</title>
<meta name="description" content="Meeting guides for our book club: agenda, chapter recaps and discussion questions.">
<meta property="og:title" content="Novel Relations">
<meta property="og:description" content="Meeting guides for our book club: agenda, chapter recaps and discussion questions.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2c5d4c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%232c5d4c%27/%3E%3Cpath d=%27M14 18c6-3 12-3 18 1v29c-6-4-12-4-18-1z%27 fill=%27%23fff%27/%3E%3Cpath d=%27M50 18c-6-3-12-3-18 1v29c6-4 12-4 18-1z%27 fill=%27%23e3efe9%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root {
  /* Layout: settings column beside a reading column on wide screens; one column on phones. */
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202a;
  --muted: #5a6571;
  --line: #d9dfe5;
  --accent: #2c5d4c;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe9;
  --mark: #f3dc8e;
  --warn: #8a5a00;
  --warn-soft: #fbf1d9;
  --danger: #a3302a;
  --star: #85600f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b;
    --surface: #182027;
    --ink: #e7ecf1;
    --muted: #9aa6b2;
    --line: #2b3640;
    --accent: #79c3a6;
    --accent-ink: #0d1a15;
    --accent-soft: #1d2f29;
    --mark: #5a4a17;
    --warn: #f0c46a;
    --warn-soft: #2e2614;
    --danger: #f08b84;
  --star: #e2b453;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b;
  --surface: #182027;
  --ink: #e7ecf1;
  --muted: #9aa6b2;
  --line: #2b3640;
  --accent: #79c3a6;
  --accent-ink: #0d1a15;
  --accent-soft: #1d2f29;
  --mark: #5a4a17;
  --warn: #f0c46a;
  --warn-soft: #2e2614;
  --danger: #f08b84;
  --star: #e2b453;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; line-height: 1.2; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1180px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { font-family: var(--font-display); font-size: 20px; font-weight: 650; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.layout.member { grid-template-columns: minmax(0, 820px); justify-content: center; }
.layout.member .form { display: none; }

.livebar { background: var(--accent); color: var(--accent-ink); }
.livebar[hidden] { display: none; }
.livebar-inner { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
#livebar-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livebar .dot { flex: none; }
.livebar .btn { flex: none; }
@media (max-width: 520px) {
  .top-inner { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .tabs { width: 100%; margin-left: 0; }
  .tab { flex: 1; text-align: center; }
  .brand { font-size: 17px; white-space: nowrap; }
  .brand-rest { display: none; }
  .tab { padding: 6px 11px; font-size: 13px; }
  .livebar-inner { padding: 6px 12px; }
  .livebar-meta { display: none; }
}
.livebar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); animation: pulse 1.4s ease-in-out infinite; }
.livebar .btn { background: transparent; color: var(--accent-ink); border-color: currentColor; padding: 4px 10px; font-size: 13px; }

.banner { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 70ch; }
.sec { scroll-margin-top: calc(var(--sticky, 120px) + 12px); transition: box-shadow .2s, border-color .2s; }
.sec.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sec-head .tag-now { font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 2px 8px; border-radius: 999px; }
.sec-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.card.current { border-color: var(--accent); }
.follow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.form { display: grid; gap: 14px; position: sticky; top: calc(var(--sticky, 64px) + 12px); }
@media (max-width: 860px) {
  .form { position: static; }
  /* On phones the host sees the meeting first; the planning form sits below it. */
  .layout:not(.member):not(.empty) .guide { order: -1; }
}
.form h2 { font-size: 18px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper);
}
.field textarea { min-height: 76px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.status { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status[hidden] { display: none; }

/* Guide */
.guide { display: grid; gap: 18px; }
.guide-head { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.chip.example { background: var(--mark); color: var(--ink); }
.chip.unsaved { background: var(--warn-soft); color: var(--warn); }
.guide-head h1 { font-size: clamp(26px, 4vw, 34px); }
.lead { margin: 0; max-width: 65ch; color: var(--muted); }
.accuracy { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); max-width: 70ch; }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 20px; display: grid; gap: 12px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; }
.sec-head h2 { font-size: 21px; }
.sec.busy { opacity: .6; }

.agenda { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.agenda th, .agenda td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.agenda th { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.agenda td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.scroll { overflow-x: auto; }

.chapters { display: grid; gap: 12px; }
.ch { display: grid; grid-template-columns: 52px 1fr; gap: 12px; }
.ch-num { font-family: var(--font-display); font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); border-radius: 8px; height: 40px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.ch h3 { font-size: 16px; margin-bottom: 2px; }
.ch p { margin: 0; max-width: 68ch; }
.ch ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 68ch; }

.items { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.items li { padding-left: 14px; border-left: 3px solid var(--line); max-width: 70ch; }
.items b { display: block; }
.spoiler { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--muted); font-size: 14.5px; max-width: 70ch; }
.spoiler summary { cursor: pointer; font-weight: 700; }

/* Saved */
.saved { display: grid; gap: 12px; }
.saved-group h2 { font-size: 20px; margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .title { font-weight: 700; }
.empty { color: var(--muted); }

.dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog-backdrop[hidden] { display: none; }
.dialog { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; display: grid; gap: 14px; border: 1px solid var(--line); }
.dialog h3 { font-size: 18px; }

.thinking { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }

/* Edit mode */
.editable { outline: 1px dashed var(--muted); outline-offset: 2px; border-radius: 4px; cursor: text; min-width: 3ch; }
.editable:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
.editable:empty::before { content: "Type here"; color: var(--muted); }
.items li > span.editable { display: block; margin-top: 4px; }
.rm { font-size: 12.5px; color: var(--danger); padding: 2px 4px; }
.items li.add { border-left-color: transparent; padding-left: 0; }
ul.plain { list-style: none; padding: 0; margin: 4px 0; display: grid; gap: 6px; }
.edit-bar { flex-direction: column; align-items: flex-start; }
.edit-bar input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.when { margin: 0; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.panel.export { display: grid; gap: 10px; margin-bottom: 8px; border-color: var(--accent); }

/* Print: a clean handout, always light, no app chrome. */
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --paper: #ffffff; --surface: #ffffff; --ink: #000000; --muted: #444444; --line: #cccccc;
    --accent: #2c5d4c; --accent-ink: #ffffff; --accent-soft: #eef4f1; color-scheme: light;
  }
  body { background: #fff; font-size: 11.5pt; }
  .top, .livebar, .actions, .sec-tools, .banner, .follow, #status, .form, #pub-footer, .tag-now, #view-saved { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .layout, .layout.member { display: block; }
  .guide { gap: 10pt; }
  .sec { border: 0; box-shadow: none; padding: 0; border-radius: 0; }
  .sec h2 { break-after: avoid; font-size: 15pt; }
  .ch, .items li, .agenda tr { break-inside: avoid; }
  .chip { border: 1px solid #ccc; }
  .spoiler { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
@page { margin: 0.6in; }
.edit-fields { display: flex; flex-wrap: wrap; gap: 10px; }
.edit-fields label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.edit-fields input { width: 9.5em; }
.edit-fields input[type="number"] { width: 6.5em; }
.panel.export a { color: var(--accent); }

/* ---------- Club features ---------- */
/* Typographic covers: a hue per title, no images needed. */
.cover { --hue: 160; flex: none; width: 72px; height: 104px; border-radius: 4px 8px 8px 4px; padding: 8px 7px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(90deg, hsl(var(--hue) 30% 22%) 0 6px, hsl(var(--hue) 38% 34%) 6px); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); overflow: hidden; }
.cover-title { font-family: var(--font-display); font-size: 11px; font-weight: 650; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cover-author { font-size: 8.5px; opacity: .85; line-height: 1.2; }
.cover.sm { width: 48px; height: 70px; padding: 5px; }
.cover.sm .cover-title { font-size: 8px; -webkit-line-clamp: 4; } .cover.sm .cover-author { display: none; }
.cover.xs { width: 30px; height: 44px; padding: 3px; } .cover.xs .cover-title, .cover.xs .cover-author { display: none; }

.book-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.book-head h2 { font-size: 20px; margin: 0; }
.chip.next { background: var(--accent); color: var(--accent-ink); }
.chip.done { background: var(--line); color: var(--ink); }
.chip.planned { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.card .chips { gap: 4px; }
.card.planned { border-style: dashed; cursor: default; }

.meet-actions { margin-top: 2px; }
details.cal { position: relative; }
details.cal > summary { list-style: none; }
details.cal > summary::-webkit-details-marker { display: none; }
.cal-menu { position: absolute; z-index: 4; top: calc(100% + 6px); left: 0; min-width: 220px; display: grid; gap: 2px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
.cal-menu .btn { justify-content: flex-start; padding: 8px 10px; width: 100%; text-decoration: none; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }

.shield { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; color: var(--muted); }
.shield select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-weight: 500; color: var(--ink); }
.ch.shielded .ch-num { background: var(--line); color: var(--muted); }

.club { display: grid; gap: 16px; }
.shelf-head { display: grid; gap: 8px; }
.club-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 14px 16px; margin-bottom: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); }
.club-id { display: grid; gap: 4px; min-width: 0; }
.club-name { margin: 0; font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 30px); font-weight: 650; line-height: 1.15; }
.club-blurb { margin: 0; color: var(--muted); font-size: 15px; }
.club-forms { display: flex; flex-wrap: wrap; gap: 8px; }
@media print { .club-forms { display: none !important; } .club-bar { border: 0; padding: 0; } }
.shelf-head h1 { font-size: clamp(26px, 4vw, 34px); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.shelf-item { display: flex; gap: 12px; align-items: flex-start; }
.shelf-item > div { display: grid; gap: 3px; min-width: 0; }
.shelf-item .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { color: var(--star); letter-spacing: 1px; font-size: 15px; }
.rating-num { color: var(--muted); font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.verdict { font-style: italic; }

.club-editors { display: grid; gap: 16px; }
.club-editors .field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.club-editors .field .hint { font-weight: 400; }
.club-editors input, .club-editors select, .club-editors textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-weight: 500; color: var(--ink); }
.club-editors textarea { min-height: 64px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plan-rows { display: grid; gap: 10px; }
.plan-row { display: grid; grid-template-columns: 2fr 0.8fr 1fr 1.2fr 1fr 1.2fr auto; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.plan-row.shelf-edit { grid-template-columns: 2fr auto 1fr 2.5fr; align-items: center; }
.plan-row.upnext { grid-template-columns: 2fr 1.5fr auto; }
.book-mini { display: flex; gap: 8px; align-items: center; min-width: 0; }
.club-actions { position: sticky; bottom: 0; padding: 10px 0; background: var(--paper); }
.preview-label { font-size: 15px; color: var(--muted); font-family: var(--font-body); margin-top: 8px; }
.preview { display: grid; gap: 16px; padding: 16px; border: 2px dashed var(--line); border-radius: 16px; }
@media (max-width: 860px) {
  .plan-row, .plan-row.shelf-edit, .plan-row.upnext { grid-template-columns: 1fr 1fr; }
  .plan-row .rm { justify-self: start; }
  .grid2 { grid-template-columns: 1fr; }
}
@media print { .meet-actions, .shield, .cal-menu { display: none !important; } }

#saved-list { display: grid; gap: 28px; }
#club-root { display: grid; gap: 16px; }
.view-title { font-size: clamp(24px, 4vw, 30px); }
.shelf-item .about { margin: 4px 0 2px; font-size: 14.5px; max-width: 60ch; }
.plan-row.shelf-edit .about-edit { grid-column: 1 / -1; }
/* Section jump bar: sticks under the header, scrolls sideways on phones. */
.jump { position: sticky; top: var(--sticky, 64px); z-index: 3; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: 0 -2px;
  background: var(--paper); scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent); mask-image: linear-gradient(90deg, #000 92%, transparent); }
.jump::-webkit-scrollbar { display: none; }
.jump-btn { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.jump-btn:hover { border-color: var(--accent); }
.sec { scroll-margin-top: calc(var(--sticky, 120px) + 58px); }
@media print { .jump { display: none !important; } }
.jump-btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>
<template id="shell">
<header class="top">
  <div class="top-inner">
    <div class="brand">Book Club <span class="brand-rest">Meeting Planner</span></div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button class="tab" id="tab-plan" role="tab" aria-selected="true" aria-controls="view-plan" tabindex="0">Plan a meeting</button>
      <button class="tab" id="tab-saved" role="tab" aria-selected="false" aria-controls="view-saved" tabindex="-1">Saved meetings <span id="saved-count"></span></button>
      <button class="tab" id="tab-club" role="tab" aria-selected="false" aria-controls="view-club" tabindex="-1">Club</button>
    </div>
  </div>
  <div class="livebar" id="livebar" hidden>
    <div class="livebar-inner">
      <span class="dot" aria-hidden="true"></span>
      <span id="livebar-text">Now discussing</span>
      <button class="btn" id="livebar-jump" type="button">Jump there</button>
      <button class="btn" id="livebar-stop" type="button" hidden>End</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status" hidden style="margin-bottom:16px"></div>
  <section id="view-plan" class="layout" role="tabpanel" aria-labelledby="tab-plan">

ood makes them so content they nearly forget who they are. Peaceful or creepy?","What other in-between places, real or fictional, does it remind you of?","What does Polly's insistence on marking the pool home say about her compared with Digory?","How does Lewis's version of many worlds compare with modern multiverse stories?"],"title":"The Wood Between the Worlds"},{"chapter":"4","questions":["Which details made Charn feel most real to you?","What is Lewis saying with faces that start kind and grow crueler down the line?","The verse dares the reader to strike or wonder forever. Is curiosity a good enough reason to take a risk?","Digory hurts Polly to get his way. Does that change how you feel about him as the hero?"],"title":"The Bell and the Hammer"},{"chapter":"5","questions":["What makes the Queen frightening beyond her power?","She uses almost the same excuse as Uncle Andrew. Why do you think Lewis echoed it on purpose?","She quickly decides whoever sent the children must be a powerful magician. What does that show about how she sees the world?","Who is to blame for bringing her along: Digory, Uncle Andrew, or both?"],"title":"The Deplorable Word"}],"context":[{"detail":"Published in 1955 as the sixth Narnia book, but it takes place before all the others. Lewis finished it in 1954.","title":"Written late, set first"},{"detail":"In 1957 Lewis told a young fan, Laurence Krieg, he leaned toward reading the books in story order. HarperCollins later renumbered the series to put this book first.","title":"The reading-order fight"},{"detail":"Lewis's mother died of cancer when he was a boy, and many readers see that loss in Digory's sick mother.","title":"A real loss behind Digory's grief"},{"detail":"The opening mentions Sherlock Holmes and Nesbit's Bastable children. Her 1906 book The Story of the Amulet follows a strikingly similar pattern.","title":"A nod to E. Nesbit"}],"icebreakers":[{"prompt":"Show of hands before anyone explains: would you have struck the bell?","title":"The bell vote"},{"prompt":"What kind of world do you hope is under the next pool in the Wood?","title":"Pick a pool"},{"prompt":"Is this your first trip to Narnia? Books, movies, or neither?","title":"Narnia history"},{"prompt":"What secret or forbidden spot did you explore as a kid?","title":"Your attic tunnel"}],"lead":"In five chapters, a London attic adventure turns into a trip to a dead world, and the children bring back the most dangerous person in it.","recap":[{"chapter":"1","summary":"London, around 1900. Polly meets Digory, who is staying with Uncle Andrew and Aunt Letty while his mother is seriously ill. They crawl through the attic tunnel, end up in Uncle Andrew's study, and he tricks Polly into touching a yellow ring. She vanishes.","title":"The Wrong Door"},{"chapter":"2","summary":"Uncle Andrew explains the rings came from dust out of Atlantis, in a box he promised his godmother to destroy. Too scared to test them himself, he pressures Digory into following Polly with green rings.","title":"Digory and His Uncle"},{"chapter":"3","summary":"Digory finds Polly in a sleepy wood full of pools. They nearly forget who they are, work out that the wood is an in-between place, mark the pool home, and try another.","title":"The Wood Between the Worlds"},{"chapter":"4","summary":"In Charn, a ruined city under a dying red sun, they find a hall of seated royals and a bell with a verse daring them to strike it. Digory hurts Polly to stop her and rings it. A terrifying queen wakes.","title":"The Bell and the Hammer"},{"chapter":"5","summary":"The Queen explains she destroyed every living thing in her world with one word to win a war against her sister. She plans to rule the children's world, and grabs hold as they escape.","title":"The Deplorable Word"}],"spoilerNote":"Digory grows up to be someone the Pevensie children meet, and the Queen is a character Narnia fans already know. Ask the group before going here.","themes":[{"prompt":"Every disaster so far starts with someone who can't leave something alone. Where does healthy curiosity end and temptation begin?","title":"Curiosity vs. temptation"},{"prompt":"Both believe they live by different rules than ordinary people. Is Uncle Andrew a small, cowardly version of her?","title":"Uncle Andrew and the Queen as a matched pair"},{"prompt":"Guinea pigs, then Polly, then Digory. What does the book say about treating people as means to an end?","title":"Using others as test subjects"},{"prompt":"How might Digory's fear for his mother be shaping his choices, including the bell?","title":"Grief under the surface"},{"prompt":"They argue, compete, and he hurts her. Is it a realistic kid friendship? How does it hold up today?","title":"Polly and Digory's friendship"},{"prompt":"Written in the shadow of the atomic bomb, the Deplorable Word reads to many as a world-ending weapon. Does that work for you?","title":"A dead world as a warning"},{"prompt":"Lewis often talks straight to the reader. Charming, or does it pull you out of the story?","title":"The narrator's voice"}],"wrapUp":{"bring":"One moment you'd want to see on screen.","nextReading":"Chapters 6–10","predictions":["What happens when the Queen arrives in London?","Does Uncle Andrew finally get what he deserves?","Will Digory find a way to help his mother?"]}},"meetingNumber":1,"minutes":90,"updatedAt":"2026-11-09T03:15:00.000Z","id":"m-magicians-nephew-1","time":"18:00","type":"chapters"},{"id":"m-magicians-nephew-2","book":"The Magician's Nephew","author":"C.S. Lewis","chapters":"6–10","meetingNumber":2,"minutes":90,"date":"2026-11-15","time":"18:00","type":"chapters","guide":{"lead":"The Queen arrives in London, chaos follows her to Digory's front door, and everyone tumbles into a dark, empty world just as a Lion begins to sing it into life.","accuracy":{"confidence":"high","note":""},"agenda":[{"time":"0:00–0:10","segment":"Welcome + icebreaker","details":"One quick round from the icebreakers"},{"time":"0:10–0:20","segment":"Recap","details":"Someone walks through chapters 6–10 in five minutes"},{"time":"0:20–0:55","segment":"Chapter questions","details":"Pick 2–3 questions per chapter"},{"time":"0:55–1:15","segment":"Big themes","details":"Choose two talking points to go deep on"},{"time":"1:15–1:25","segment":"Context + the movie","details":"Lewis, Tolkien and creation through song; the 2027 film"},{"time":"1:25–1:30","segment":"Wrap-up","details":"Predictions, set chapters 11–15 for next time"}],"recap":[{"chapter":"6","title":"The Beginning of Uncle Andrew's Troubles","summary":"Back in London, Digory and Polly talk through their fight over the bell and make up. Uncle Andrew, scared but dazzled by the Queen, dresses up and tries to borrow money from Aunt Letty. The Queen bursts in and orders him to take her into the city."},{"chapter":"7","title":"What Happened at the Front Door","summary":"Aunt Letty is no match for the Queen, whose magic doesn't work in our world but whose strength does. Digory waits at the door with the rings, hoping to send her home. She returns standing on a runaway hansom cab, with a battered Uncle Andrew, a robbed shopkeeper, police and a crowd behind her."},{"chapter":"8","title":"The Fight at the Lamp-Post","summary":"The Queen tears an iron bar off a lamp-post and fights the crowd. Digory grabs her ankle, and the rings pull her, Uncle Andrew, the cabby and his horse Strawberry into the Wood and then into a dark, empty world. A voice begins to sing, and stars and a sun appear. The singer is a great Lion."},{"chapter":"9","title":"The Founding of Narnia","summary":"The Lion's song brings up grass, trees and animals from the bare earth. The iron bar from London grows into a lamp-post, and Uncle Andrew starts scheming about how to make money from soil like this. The Lion chooses some of the animals and gives them the gift of speech."},{"chapter":"10","title":"The First Joke and Other Matters","summary":"A jackdaw makes the first joke in the new world, and the Talking Beasts learn to laugh. The animals can't work out what Uncle Andrew is, and their attempts to look after him go comically wrong. Digory works up the courage to ask the Lion for something to cure his mother."}],"icebreakers":[{"title":"First words","prompt":"If you could give one animal the power of speech, which one, and what would it say first?"},{"title":"Relative roulette","prompt":"Uncle Andrew or Aunt Letty: who would you rather have over for dinner?"},{"title":"Funniest moment","prompt":"What was the funniest part of the Queen loose in London?"},{"title":"The sound of it","prompt":"What did the Lion's song sound like in your head while you read?"}],"chapterQuestions":[{"chapter":"6","title":"The Beginning of Uncle Andrew's Troubles","questions":["Digory and Polly make up after their fight over the bell. Did the apology feel real to you?","Uncle Andrew is frightened of the Queen and flattered by her at the same time. What does that say about him?","Why does Lewis play this chapter mostly for laughs after the horror of Charn?"]},{"chapter":"7","title":"What Happened at the Front Door","questions":["The Queen's magic fails in our world but her strength doesn't. Is she more or less frightening in London?","Aunt Letty stands up to her. What did you make of Aunt Letty?","Digory waits at the door to fix his mistake. Is this where he starts to grow up?","How does the chaos at the front door read to you: comedy, danger, or both?"]},{"chapter":"8","title":"The Fight at the Lamp-Post","questions":["Digory grabs the Queen's ankle and takes her along. Brave, reckless, or both?","The cabby and his horse end up in another world by accident. Why do you think Lewis brings ordinary people along?","How did you picture the moment the singing begins in total darkness?"]},{"chapter":"9","title":"The Founding of Narnia","questions":["Everyone hears the same song, yet reacts differently. Who reacts how, and why?","The iron bar becomes a lamp-post. What does that detail add?","Uncle Andrew looks at a new world and sees a money-making scheme. What does that tell us about him?","Which image from the creation scene has stuck with you most?"]},{"chapter":"10","title":"The First Joke and Other Matters","questions":["Why might Lewis make a joke one of the first things a talking creature does?","The animals can't decide what Uncle Andrew is. Why can't he understand them either?","Digory wants to ask the Lion for help with his mother. What do you think he should ask for, and what might it cost him?"]}],"themes":[{"title":"Same song, different ears","prompt":"The cabby and Polly hear something beautiful; Uncle Andrew hears roaring he wants to ignore. Does what we notice depend on who we are?"},{"title":"Wonder vs. greed","prompt":"Faced with a newborn world, Uncle Andrew thinks about profit. Where else in the book do characters miss wonder because they want to own things?"},{"title":"Creation as music","prompt":"Lewis makes creation a song rather than a command. What does that change about how the world feels?"},{"title":"Power out of its element","prompt":"In London the Queen is strong but her magic fails. What is Lewis saying about where her power really comes from?"},{"title":"Ordinary goodness","prompt":"The cabby is one of the kindest people in the story. What makes him stand out next to Uncle Andrew?"},{"title":"Hope and responsibility","prompt":"Digory brought the Queen into this world. Can he still ask for help for his mother? How do guilt and hope sit together?"}],"context":[{"title":"Lewis and Tolkien","detail":"Lewis and J.R.R. Tolkien were close friends at Oxford and members of the Inklings writing group. Tolkien also imagined a world created through music, in the myth that opens The Silmarillion."},{"title":"The lamp-post","detail":"Readers of The Lion, the Witch and the Wardrobe will recognize this lamp-post. This book shows where it came from."},{"title":"Written late, set first","detail":"Published in 1955 as the sixth Narnia book, but set first in Narnia's history."},{"title":"A dig at Uncle Andrew's kind","detail":"Lewis often wrote against people who treat the world only as raw material. Uncle Andrew's money scheme in a newborn world is a sharp example."}],"spoilerNote":"Several of the people who arrive in Narnia in these chapters have bigger parts to play later in this book and in the series. Ask the group before going there.","adaptations":[{"title":"Narnia: The Magician's Nephew (Greta Gerwig)","detail":"As of Nov 2026, set for theaters and IMAX on Feb 12, 2027 and Netflix on Apr 2, 2027. The creation scene will be one to watch for. Check current news."}],"wrapUp":{"predictions":["Will the Lion help Digory's mother?","What happens to Uncle Andrew in Narnia?","Where did the Queen go, and what will she do next?"],"nextReading":"Chapters 11–15 (the end of the book)","bring":"Your favorite moment from the creation scene."}},"createdAt":"2026-11-09T03:15:00.000Z","updatedAt":"2026-11-09T03:15:00.000Z"}],"club":{"currentId":"m-magicians-nephew-2","now":""},"settings":{"blurb":"","clubName":"Novel Relations","rsvpUrl":"https://forms.gle/ceJnWhykB2uRWs8fA","timezone":"America/New_York","voteLabel":"","voteUrl":"https://forms.gle/LTvpAKNpVVYo7N9a8"},"schedule":[{"author":"C.S. Lewis","book":"The Magician's Nephew","chapters":"11–15","date":"","id":"p-mn-3","meetingNumber":3,"time":"18:00","type":"chapters"}],"shelf":{"books":{"the magician's nephew":{"about":"C.S. Lewis's 1955 prequel to the Chronicles of Narnia, set in London around 1900. Digory and Polly get caught up in his uncle's experiment with magic rings and end up far from home, in other worlds. Published sixth in the series but set first in Narnia's history. 15 chapters.","finished":false,"rating":"","verdict":""}},"upNext":[]},"public":true,"exportedAt":"2026-11-09T20:11:35.533409Z"}</script>
<script id="app-script">// Mount the page markup (kept pristine in <template id="shell"> so the page can republish itself).

const $ = (id) => document.getElementById(id);

  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));

};
const str = (v) => (v == null ? "" : String(v));

};

// ---------- Shared state, embedded in the page ----------

// Publish a new version of this page carrying the new data. Every open copy reloads to it.
async function publishState(data, okMsg, opts = {}) {
  if (!S.artifact) { setStatus("Saving isn't available in this view. Open the page in Claude, signed in as the host.", true); return false; }

// A final wrap-up covers the whole book, so Chapters isn't required for it.
function syncTypeField() {
  const wrap = $("f-type").value === "wrapup", ch = $("f-chapters");
  ch.required = !wrap;
  ch.placeholder = wrap ? "Whole book" : "e.g. 1–5";
  if (wrap && !ch.value.trim()) ch.value = "Whole book";
  if (!wrap && ch.value.trim() === "Whole book") ch.value = "";
}
$("f-type").addEventListener("change", syncTypeField);
function fillNext(m) {
  const n = (m.meetingNumber || 1) + 1;
  const p = plannedFor(m.book, n);
  if (p) fillForm({ ...m, ...p, notes: m.notes });
  else fillForm({ ...m, chapters: nextRange(m.chapters), meetingNumber: n, date: "", type: "chapters" });
}
function plannedFor(book, n) { return S.data.schedule.find(p => sameBook(p.book, book) && p.meetingNumber === n) || null; }
function nextRange(chapters) {
  const m = str(chapters).match(/(\d+)\s*[-–—to]+\s*(\d+)/i);
  if (m) {
    const a = +m[1], b = +m[2], len = Math.max(1, b - a + 1);
    return `${b + 1}–${b + len}`;
  }
  const one = str(chapters).match(/(\d+)/);
  return one ? String(+one[1] + 1) : "";
}

// ---------- Prompt ----------
function sameBook(a, b) { return str(a).trim().toLowerCase() === str(b).trim().toLowerCase(); }

function previousContext(f) {
  const prev = meetings().filter(m => sameBook(m.book, f.book) && m.id !== S.current?.id && (m.meetingNumber || 0) < f.meetingNumber);
  if (!prev.length) return "";
  const lines = prev.slice(0, 6).map(m => {
    const qs = arr(m.guide?.chapterQuestions).flatMap(c => arr(c.questions)).slice(0, 12).map(q => "  - " + str(q).slice(0, 160));
    return `Meeting ${m.meetingNumber} covered chapters ${m.chapters}. Questions already used:\n${qs.join("\n")}`;
  });
  return "\nEarlier meetings of this club on the same book (don't repeat these questions; you may build on them):\n" + lines.join("\n");
}

// How many chapters a range like "1–5", "6-10, 12" or "Prologue–3" covers (best effort).
function chapterCount(chapters) {
  let n = 0;
  for (const part of str(chapters).split(/[,;&]|\band\b/i)) {
    const r = part.match(/(\d+)\s*(?:[-–—]|to)\s*(\d+)/i);
    if (r) n += Math.max(1, Math.abs(+r[2] - +r[1]) + 1);
    else if (/\d+/.test(part)) n += 1;
  }
  return n || 1;
}
function sizeRules(f) {
  const n = chapterCount(f.chapters);
  if (n > 8) return { q: "2 per chapter", recap: "1 sentence per chapter" };
  if (n > 5) return { q: "2 or 3 per chapter", recap: "1 or 2 sentences per chapter" };
  return { q: "3 or 4 per chapter", recap: "2 or 3 sentences per chapter" };
}
function rules(f) {
  const size = sizeRules(f);
  return `Rules:
- Cover ONLY what happens in chapters ${f.chapters}. Do not reveal plot from later chapters anywhere except "spoilerNote", and keep even that vague. Earlier chapters may be referenced.
- Be accurate. If you are unsure of the exact book, its chapter titles, or what happens in specific chapters, say so in accuracy.note, set accuracy.confidence to "medium" or "low", and keep recaps general instead of inventing details. Never invent chapter titles; use "" when unsure.
- Do not quote the book beyond a phrase of a few words. Paraphrase.
- Discussion questions: open-ended, tied to specific scenes and characters, mixing easy openers with deeper ones. ${size.q}.
- Recap: ${size.recap}.
- Agenda: 5 to 7 segments whose times add up to exactly ${f.minutes} minutes, written like "0:00–0:10".
- Icebreakers: 3 or 4, each answerable in about a minute.
- Themes: 4 to 6 big-picture talking points, each a short title plus a prompt the host can read aloud.
- Context: 3 to 5 well-established facts about the author, the book's history, influences or reception.
- Adaptations: film, TV, stage or audio versions. Your knowledge has a cutoff, so for anything recent or upcoming, tell the host to check current news; never state unconfirmed dates or casting as fact. Use [] if there are none.
- Wrap-up: 2 or 3 prediction questions, the suggested next reading, and one thing to bring next time.
- Plain words, sentences under 25 words, no emoji, no markdown inside strings.`;
}

const SCHEMA = `{
  "lead": "one sentence on what these chapters are about",
  "accuracy": {"confidence": "high|medium|low", "note": "empty when confident"},
  "agenda": [{"time": "0:00–0:10", "segment": "Welcome", "details": "..."}],
  "recap": [{"chapter": "1", "title": "Chapter title or empty", "summary": "short"}],
  "icebreakers": [{"title": "...", "prompt": "..."}],
  "chapterQuestions": [{"chapter": "1", "title": "Chapter title or empty", "questions": ["..."]}],
  "themes": [{"title": "...", "prompt": "..."}],
  "context": [{"title": "...", "detail": "..."}],
  "spoilerNote": "optional vague note for groups who have read further, or empty",
  "adaptations": [{"title": "...", "detail": "..."}],
  "wrapUp": {"predictions": ["..."], "nextReading": "...", "bring": "..."}
}`;

function header(f) {
  return `You are helping a book club host plan one meeting.

Book: ${f.book}${f.author ? " by " + f.author : ""}
Chapters for this meeting: ${f.type === "wrapup" ? "the whole book (final wrap-up)" : f.chapters}
Meeting number: ${f.meetingNumber}
Meeting length: ${f.minutes} minutes
Host's notes about the group: ${f.notes || "none"}${previousContext(f)}`;
}
// Final wrap-up meeting: the whole book, spoilers allowed, a rating round (Fable's "reflection room").
function wrapRules(f) {
  return `This is the club's FINAL meeting on this book: a whole-book wrap-up. Everyone has finished the book.
Rules:
- Spoilers are allowed: discuss the whole book, including the ending.
- Be accurate. If you are unsure of details, say so in accuracy.note, set accuracy.confidence to "medium" or "low", and stay general instead of inventing.
- Do not quote the book beyond a phrase of a few words. Paraphrase.
- Recap: 3 to 5 entries covering the arc of the story. Use "chapter" for the part ("Beginning", "Middle", "Ending", or a part name) and "title" for a short label.
- Discussion questions: 3 to 5 groups. Use "chapter" for the group name ("Characters", "Themes", "The ending", "Craft"), "title" empty, 3 or 4 questions each.
- Agenda: 5 to 7 segments adding up to exactly ${f.minutes} minutes, and include a rating round where everyone rates the book out of 5.
- Icebreakers: 3 or 4 quick whole-book prompts (one word for the book, favorite character, a line they remember).
- Themes: 4 to 6 big-picture talking points about the book as a whole.
- Context: 3 to 5 well-established facts about the author, the book's history, reception, or what came after it.
- Adaptations: film, TV, stage or audio versions; for anything recent or upcoming, tell the host to check current news. [] if none.
- Wrap-up: predictions = 2 or 3 "would you recommend it, and to whom?" style closing questions; nextReading = what the club might read next or "Vote on our next book"; bring = one thing to bring to the next meeting.
- spoilerNote: "".
- Plain words, sentences under 25 words, no emoji, no markdown inside strings.`;
}
function guidePrompt(f) {
  return `${header(f)}\n\n${f.type === "wrapup" ? wrapRules(f) : rules(f)}\n\nReply with only one JSON object in exactly this shape:\n${SCHEMA}`;
}
function sectionPrompt(f, key, guide) {
  return `${header(f)}

Here is the current meeting guide as JSON:
${JSON.stringify(guide).slice(0, 60000)}

Rewrite ONLY the "${key}" section with fresh content that differs from what is there now. Keep the same shape as in the guide.

${f.type === "wrapup" ? wrapRules(f) : rules(f)}

Reply with only a JSON object with one key: {"${key}": ...}`;
}

function normalizeGuide(g) {
  g = g && typeof g === "object" ? g : {};
  return {
    lead: str(g.lead),
    accuracy: { confidence: str(g.accuracy?.confidence || "medium"), note: str(g.accuracy?.note) },
    agenda: arr(g.agenda).map(a => ({ time: str(a.time), segment: str(a.segment), details: str(a.details) })),
    recap: arr(g.recap).map(r => ({ chapter: str(r.chapter), title: str(r.title), summary: str(r.summary) })),
    icebreakers: arr(g.icebreakers).map(i => ({ title: str(i.title), prompt: str(i.prompt) })),
    chapterQuestions: arr(g.chapterQuestions).map(c => ({ chapter: str(c.chapter), title: str(c.title), questions: arr(c.questions).map(str) })),
    themes: arr(g.themes).map(t => ({ title: str(t.title), prompt: str(t.prompt) })),
    context: arr(g.context).map(c => ({ title: str(c.title), detail: str(c.detail) })),
    spoilerNote: str(g.spoilerNote),
    adaptations: arr(g.adaptations).map(a => ({ title: str(a.title), detail: str(a.detail) })),
    wrapUp: { predictions: arr(g.wrapUp?.predictions).map(str), nextReading: str(g.wrapUp?.nextReading), bring: str(g.wrapUp?.bring) }
  };
}

function errorCopy(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      return "Claude isn't available on this page for your account, so new guides can't be written here.";
    case "rate_limited": return "Too many requests right now. Wait a minute and try again.";
    case "session_expired": return "Your session expired. Sign in to Claude again, then retry.";
    case "refused": return "Claude couldn't write a guide for that request. Try different details.";
    case "invalid_json": return "The guide came back incomplete. Try again, or cover fewer chapters in this meeting.";
    case "prompt_too_large": return "Too much saved history to send. Try again with fewer earlier meetings of this book.";
    default: return "Something went wrong while writing the guide. Try again.";
  }
}

// ---------- Generate ----------
async function generate(ev) {
  ev?.preventDefault();
  const f = readForm();
  if (f.type === "wrapup" && !f.chapters) f.chapters = "Whole book";
  if (!f.book || !f.chapters) { setStatus("Add a book title and the chapters for this meeting.", true); return; }
  if (!S.sample) { setStatus("Claude isn't available on this page right now, so new guides can't be written.", true); return; }
  if (!(await okToLeave())) return;
  S.ctl = new AbortController();
  $("btn-generate").disabled = true; $("btn-stop").hidden = false;
  setStatus([el("span", { class: "thinking" }), "  Reading the chapters and drafting… this can take a minute."]);
  try {
    const g = await S.sample.json(guidePrompt(f), {
      signal: S.ctl.signal, cache: false,
      onText: ({ text }) => setStatus([el("span", { class: "thinking" }), `  Writing the guide… ${text.length.toLocaleString()} characters so far`])
    });
    S.current = { ...f, guide: normalizeGuide(g) };
    S.isExample = false; S.unsaved = true; S.editing = false;
    ss.set("bc-draft", JSON.stringify(S.current));
    setStatus("");
    renderGuide();
    $("guide").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  } catch (e) {
    if (e?.code === "cancelled") setStatus("Stopped.");
    else {
      const retry = !["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "session_expired"].includes(e?.code);
      setStatus([errorCopy(e), retry ? el("button", { class: "btn small", type: "button", style: "margin-left:8px", onclick: () => generate() }, "Try again") : null], true);
    }
  } finally {
    $("btn-generate").disabled = false; $("btn-stop").hidden = true; S.ctl = null;
  }
}

async function redoSection(key) {
  if (!S.sample || !S.current || S.busySection) return;
  const c = S.current;
  const f = { book: c.book, author: c.author, chapters: c.chapters, meetingNumber: c.meetingNumber, minutes: c.minutes, notes: c.notes, type: c.type };
  S.busySection = key; renderGuide();
  try {
    const out = await S.sample.json(sectionPrompt(f, key, c.guide), { cache: false });
    S.current = { ...S.current, guide: normalizeGuide({ ...S.current.guide, [key]: out?.[key] ?? S.current.guide[key] }) };
    S.unsaved = true;
    if (!S.current.id) ss.set("bc-draft", JSON.stringify(S.current));
  } catch (e) {
    if (e?.code !== "cancelled") setStatus(errorCopy(e), true);
  } finally {
    S.busySection = null; renderGuide();
  }
}

// ---------- Save / share / delete ----------
function recordFrom(c) {
  const now = new Date().toISOString();
  return {
    book: c.book, author: c.author || "", chapters: c.chapters,
    meetingNumber: c.meetingNumber, minutes: c.minutes, date: c.date || "", time: c.time || "",
    type: c.type === "wrapup" ? "wrapup" : "chapters",
    notes: c.notes || "", guide: cleanGuide(c.guide),
    createdAt: c.createdAt || now, updatedAt: now
  };
}

async function save() {
  if (!S.current || !canManage()) return;
  const isNew = !S.current.id;
  const id = S.current.id || ("m-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const record = { ...recordFrom(S.current), id };
  const data = cloneData();
  data.meetings = isNew ? [...data.meetings, record] : data.meetings.map(m => (m.id === id ? record : m));
  data.schedule = data.schedule.filter(p => !(sameBook(p.book, record.book) && p.meetingNumber === record.meetingNumber));
  if (isNew) data.club = { ...data.club, currentId: id, now: "", updatedAt: record.updatedAt };
  const prev = { current: S.current, unsaved: S.unsaved };
  S.current = record; S.unsaved = false;
  const ok = await publishState(data, isNew ? "Saved. This is now the group's meeting; the public site shows it at its next update (within about 3 hours)." : "Saved. The public site shows it at its next update (within about 3 hours).");
  if (!ok) { S.current = prev.current; S.unsaved = prev.unsaved; }
  else ss.del("bc-draft");
  renderGuide(); renderSaved(); renderLivebar();
}

async function setClub(patch, msg) {
  if (!canManage()) return;
  const data = withCurrentSaved(cloneData());
  data.club = { ...data.club, ...patch, updatedAt: new Date().toISOString() };
  const ok = await publishState(data, msg || "");
  if (ok && S.current?.id) S.unsaved = false;
  renderGuide(); renderSaved(); renderLivebar();
}
function discussNow(key) { if (S.current?.id) setClub({ currentId: S.current.id, now: key }); }
function showToEveryone() { if (S.current?.id) setClub({ currentId: S.current.id, now: "" }, "Everyone now sees this meeting when they open the link."); }

// ---------- In-page confirm dialog (window.confirm is blocked in the viewer) ----------
let confirmResolve = null, confirmReturn = null;
function askConfirm({ title, text, yes, danger = true }) {
  confirmReturn = document.activeElement;
  $("confirm-title").textContent = title;
  $("confirm-text").textContent = text;
  const y = $("confirm-yes"); y.textContent = yes; y.className = "btn " + (danger ? "danger" : "primary");
  $("confirm").hidden = false; y.focus();
  return new Promise((res) => { confirmResolve = res; });
}
function closeConfirm(v) {
  $("confirm").hidden = true;
  const r = confirmResolve; confirmResolve = null; r?.(v);
  if (confirmReturn?.isConnected) confirmReturn.focus({ preventScroll: true });
  confirmReturn = null;
}
$("confirm-no").onclick = () => closeConfirm(false);
$("confirm-yes").onclick = () => closeConfirm(true);
document.addEventListener("keydown", (e) => {
  if ($("confirm").hidden) return;
  if (e.key === "Escape") { closeConfirm(false); return; }
  if (e.key === "Tab") {   // keep focus inside the dialog
    const btns = [$("confirm-yes"), $("confirm-no")];
    const i = btns.indexOf(document.activeElement);
    e.preventDefault();
    btns[(i + (e.shiftKey ? btns.length - 1 : 1)) % btns.length].focus();
  }
});

// Ask before throwing away unsaved work (an edited guide or an unsaved new guide).
async function okToLeave() {
  if (!(S.isHost && S.unsaved && S.current)) return true;
  const ok = await askConfirm({
    title: "Discard unsaved changes?",
    text: S.current.id ? "Your edits to this guide haven't been saved." : "This new guide hasn't been saved yet. It will be lost.",
    yes: "Discard"
  });
  if (ok) { S.unsaved = false; S.editing = false; if (!S.current.id) ss.del("bc-draft"); }
  return ok;
}
// Put the guide back to its saved version (or drop an unsaved new guide).
async function discardChanges() {
  if (!(await okToLeave())) return;
  const saved = S.current?.id && S.data.meetings.find(x => x.id === S.current.id);
  if (saved) S.current = { ...saved, guide: normalizeGuide(saved.guide) };
  else {
    const list = meetings();
    const m = list.find(x => x.id === club().currentId) || list[0];
    S.current = m ? { ...m, guide: normalizeGuide(m.guide) } : null;
  }
  S.unsaved = false; S.editing = false;
  setStatus("");
  renderGuide();
}

async function askDelete(m) {
  const ok = await askConfirm({ title: "Delete this meeting?", text: "This removes the saved guide for everyone who uses this link. You can undo for 10 minutes.", yes: "Delete" });
  if (ok) deleteMeeting(m);
}
async function deleteMeeting(m) {
  if (!m || !canManage()) return;
  const data = cloneData();
  data.meetings = data.meetings.filter(x => x.id !== m.id);
  if (data.club.currentId === m.id) data.club = { ...data.club, currentId: "", now: "" };
  const keep = S.current;
  const wasCurrent = S.data.club?.currentId === m.id;
  const record = { ...m, guide: m.guide };
  ss.set("bc-undo", JSON.stringify({ record, wasCurrent, at: Date.now() }));
  if (S.current?.id === m.id) {
    // The deleted meeting leaves the screen; show the group's meeting or the empty state.
    const next = data.meetings.find(x => x.id === data.club.currentId) || [...data.meetings].sort((a, b) => str(b.createdAt).localeCompare(str(a.createdAt)))[0];
    S.current = next ? { ...next, guide: normalizeGuide(next.guide) } : null;
    S.unsaved = false; S.editing = false;
    if (next) ss.set("bc-viewing", next.id); else ss.del("bc-viewing");
  }
  const ok = await publishState(data, "", { keepUndo: true });
  if (!ok) { S.current = keep; ss.del("bc-undo"); }
  renderGuide(); renderSaved(); renderLivebar();
  if (ok) showUndo();
}

function showUndo() {
  let u = null;
  try { u = JSON.parse(ss.get("bc-undo") || "null"); } catch {}
  if (!u?.record || !canManage()) return;
  if (Date.now() - (u.at || 0) > 10 * 60 * 1000) { ss.del("bc-undo"); return; }   // offer Undo for 10 minutes
  const r = u.record;
  setStatus([`Deleted ${r.book}, meeting ${r.meetingNumber}. `,
    el("button", { class: "btn small", type: "button", style: "margin-left:6px", onclick: undoDelete }, "Undo")]);
}
async function undoDelete() {
  let u = null;
  try { u = JSON.parse(ss.get("bc-undo") || "null"); } catch {}
  if (!u?.record) return;
  const data = cloneData();
  if (!data.meetings.some(x => x.id === u.record.id)) data.meetings.push(u.record);
  if (u.wasCurrent) data.club = { ...data.club, currentId: u.record.id, updatedAt: new Date().toISOString() };
  S.current = { ...u.record, guide: normalizeGuide(u.record.guide) }; S.unsaved = false;
  ss.set("bc-viewing", u.record.id);
  const ok = await publishState(data, "Meeting restored.");
  renderGuide(); renderSaved(); renderLivebar();
  if (!ok) showUndo();
}

function planNext() {
  const c = S.current; if (!c) return;
  fillNext(c);
  setStatus("");
  showView("plan");
  $("form").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  $("f-chapters").focus({ preventScroll: true });
}

// ---------- Export ----------
function toMarkdown(m) {
  const g = m.guide, L = [];
  L.push(`# ${m.book} — Meeting ${m.meetingNumber} (Ch. ${m.chapters})`);
  const sub = [m.author, m.date, m.time ? fmtTime(m.time) : "", `${m.minutes} minutes`].filter(Boolean).join(" · ");
  if (sub) L.push("", sub);
  if (g.lead) L.push("", g.lead);
  if (g.agenda.length) { L.push("", "## Agenda", "", "| Time | Segment | What happens |", "| --- | --- | --- |"); g.agenda.forEach(a => L.push(`| ${a.time} | ${a.segment} | ${a.details} |`)); }
  if (g.recap.length) { L.push("", "## Chapter recap"); g.recap.forEach(r => L.push("", `**Ch. ${r.chapter}${r.title ? ": " + r.title : ""}** — ${r.summary}`)); }
  if (g.icebreakers.length) { L.push("", "## Icebreakers", ""); g.icebreakers.forEach(i => L.push(`- **${i.title}:** ${i.prompt}`)); }
  if (g.chapterQuestions.length) { L.push("", "## Discussion questions"); g.chapterQuestions.forEach(c => { L.push("", `### Chapter ${c.chapter}${c.title ? ": " + c.title : ""}`, ""); c.questions.forEach((q, i) => L.push(`${i + 1}. ${q}`)); }); }
  if (g.themes.length) { L.push("", "## Big-picture talking points", ""); g.themes.forEach(t => L.push(`- **${t.title}.** ${t.prompt}`)); }
  if (g.context.length) { L.push("", "## Interesting context", ""); g.context.forEach(c => L.push(`- **${c.title}.** ${c.detail}`)); }
  if (g.spoilerNote) L.push("", `> **Spoiler box (only if everyone has read further):** ${g.spoilerNote}`);
  if (g.adaptations.length) { L.push("", "## Film, TV and stage", ""); g.adaptations.forEach(a => L.push(`- **${a.title}.** ${a.detail}`)); }
  const w = g.wrapUp;
  if (w.predictions.length || w.nextReading || w.bring) {
    L.push("", "## Wrap-up", "");
    w.predictions.forEach(p => L.push(`- Prediction: ${p}`));
    if (w.nextReading) L.push(`- Next reading: ${w.nextReading}`);
    if (w.bring) L.push(`- Bring next time: ${w.bring}`);
  }
  return L.join("\n") + "\n";
}
function fileName(m) {
  return (`${m.book}-meeting-${m.meetingNumber}`).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md";
}
function toPlainText(m) {
  const g = m.guide, L = [];
  const head = `${m.book}: meeting ${m.meetingNumber}, chapters ${m.chapters}`;
  L.push(head.toUpperCase());
  if (m.date) L.push(whenText(m.date, m.time).split(" · ").slice(0, m.time ? 2 : 1).join(" · "));
  if (g.lead) L.push("", g.lead);
  const section = (t) => L.push("", t.toUpperCase());
  if (g.agenda.length) { section("Agenda"); g.agenda.forEach(a => L.push(`${a.time}  ${a.segment}${a.details ? ": " + a.details : ""}`)); }
  if (g.recap.length) { section("Chapter recap"); g.recap.forEach(r => L.push(`Ch. ${r.chapter}${r.title ? " (" + r.title + ")" : ""}: ${r.summary}`)); }
  if (g.icebreakers.length) { section("Icebreakers"); g.icebreakers.forEach(i => L.push(`- ${i.title}: ${i.prompt}`)); }
  if (g.chapterQuestions.length) { section("Discussion questions"); g.chapterQuestions.forEach(c => { L.push(`Ch. ${c.chapter}${c.title ? " (" + c.title + ")" : ""}`); c.questions.forEach((q, i) => L.push(`  ${i + 1}. ${q}`)); }); }
  if (g.themes.length) { section("Big-picture talking points"); g.themes.forEach(t => L.push(`- ${t.title}: ${t.prompt}`)); }
  if (g.context.length) { section("Interesting context"); g.context.forEach(c => L.push(`- ${c.title}: ${c.detail}`)); }
  if (g.adaptations.length) { section("Film, TV and stage"); g.adaptations.forEach(x => L.push(`- ${x.title}: ${x.detail}`)); }
  const w = g.wrapUp;
  if (w.predictions.length || w.nextReading || w.bring) {
    section("Wrap-up");
    w.predictions.forEach(p => L.push(`- Prediction: ${p}`));
    if (w.nextReading) L.push(`- Next reading: ${w.nextReading}`);
    if (w.bring) L.push(`- Bring next time: ${w.bring}`);
  }
  return L.join("\n") + "\n";   // the spoiler note is left out on purpose: copies get forwarded
}

        el("button", { class: "btn link rm", type: "button", "aria-label": `Remove ${b.title || "book"} from Up next`, onclick: () => { d.shelf.upNext.splice(i, 1); renderClub(); $("club-save").disabled = false; } }, "Remove")))),
      el("div", {}, el("button", { class: "btn", type: "button", onclick: () => { d.shelf.upNext.push({ title: "", author: "" }); renderClub(); $("club-save").disabled = false; } }, "+ Add a book"))),
    el("div", { class: "actions club-actions" },
      el("button", { class: "btn primary", id: "club-save", type: "button", disabled: true, onclick: saveClub }, "Save club changes"),
      el("button", { class: "btn", type: "button", onclick: () => { clubDraft = null; renderClub(); } }, "Discard")));
  root.replaceChildren(editors,
    el("h2", { class: "preview-label" }, "What members see on the Bookshelf tab"),
    el("div", { class: "preview" }, ...bookshelf({ ...S.data, settings: d.settings, schedule: d.schedule, shelf: d.shelf })));
}

// ---------- Saved list ----------
const SITE_URL = "https://rico9267.github.io/bookclub/";
// The public copy of the data: no live section, no host notes about the group.
function publicData(data) {
  const d = JSON.parse(JSON.stringify(data));
  d.club = { currentId: obj(d.club).currentId || "", now: "" };
  d.meetings = d.meetings.map(({ notes, ...m }) => m);
  d.public = true;
  return d;
}
// Private mirror for the daily site sync: one record per meeting, so a sync only fetches what changed.
// Owner-only (db rules), never shown on the page. A failed or slow mirror never blocks a save.
async function mirrorToDb(data) {
  if (!S.db || !S.isHost) return;
  const pub = publicData(data);
  const metaRef = S.db.doc("pub/meta");
  const snap = await metaRef.get();
  const prev = snap.exists ? obj(snap.data()) : {};
  const stamps = Object.fromEntries(arr(prev.meetings).map(x => [x.id, x.updatedAt]));
  for (const m of pub.meetings) if (stamps[m.id] !== m.updatedAt) await S.db.doc("pubmeetings/" + m.id).set(m);
  for (const id of Object.keys(stamps)) if (!pub.meetings.some(m => m.id === id)) await S.db.doc("pubmeetings/" + id).delete();
  const meta = { currentId: pub.club.currentId, settings: pub.settings, schedule: pub.schedule, shelf: pub.shelf,
                 meetings: pub.meetings.map(m => ({ id: m.id, updatedAt: m.updatedAt })) };
  const same = JSON.stringify({ ...prev, mirroredAt: undefined }) === JSON.stringify({ ...meta, mirroredAt: undefined });
  if (!same) await metaRef.set({ ...meta, mirroredAt: new Date().toISOString() });
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
function publicHtml() {
  const d = publicData(cloneData());
  d.exportedAt = new Date().toISOString();
  // Members see the club's name, not the host tool's (first match = the <head> title).
  const name = (d.settings.clubName.trim() || "Book Club").replace(/[<>&"]/g, "");
  return buildHtml(d).replace("<title>Book Club Meeting Planner</title>", `<title>${name}</title>`).replace('<meta property="og:title" content="Book Club">', `<meta property="og:title" content="${name}">`);
}
async function exportPublic(btn) {
  if (!meetings().length) { setStatus("Save at least one meeting first.", true); return; }
  const html = publicHtml();
  if (S.downloads) {
    try { await S.downloads.save({ filename: "index.html", data: html }); setStatus("Downloaded index.html. Upload it to the bookclub repo on GitHub to update the public site."); return; }
    catch {}
  }
  try { await navigator.clipboard.writeText(html); btn.textContent = "Copied page code"; setStatus("Page code copied. Paste it into a file named index.html, then upload it to your host."); }
  catch { setStatus("Couldn't download or copy the page here. Try again from the Claude app on a computer.", true); }
}
function exportPanel() {
  if (!S.isHost || PUBLIC) return null;
  return el("div", { class: "panel export" },
    el("h2", { style: "font-size:18px" }, "Your club's public site"),
    el("p", { style: "margin:0;font-weight:700" }, el("a", { href: SITE_URL, target: "_blank", rel: "noopener" }, SITE_URL.replace("https://", ""))),
    el("p", { class: "hint", style: "font-size:14px;margin:0" },
      "Anyone can open this link with no account. It updates automatically six times a day (8:37 AM, 12:37, 3:37, 5:37, 8:37 and 11:37 PM Eastern) with whatever you've saved here. Need it sooner? Ask Claude to \u201cupdate the book club site.\u201d The public copy is read-only and leaves out your notes about the group."),
    el("div", { class: "actions" },
      el("button", { class: "btn", type: "button", onclick: (e) => exportPublic(e.currentTarget) }, "Download public page")));
}
function renderFooter() {
  if (!PUBLIC || $("pub-footer")) return;
  document.querySelector(".brand-rest")?.remove();
  const when = S.data.exportedAt ? new Date(S.data.exportedAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  document.querySelector("main").append(el("p", { class: "hint", id: "pub-footer", style: "margin-top:24px;text-align:center" },
    when ? `Updated ${when}. Refresh for the latest guide.` : "Refresh for the latest guide."));
}

function openMeeting(m, opts = {}) {
  S.editing = false;
  S.current = { ...m, guide: normalizeGuide(m.guide) };
  S.isExample = false; S.unsaved = false;
  ss.set("bc-viewing", m.id);
  if (!S.isHost) { S.follow = m.id === club().currentId; ss.set("bc-follow", S.follow ? "1" : "0"); }
  if (S.isHost && !opts.keepForm) fillForm(m);
  setStatus("");
  renderGuide();
  showView("plan");
  window.scrollTo(0, 0);
}

const VIEWS = ["plan", "saved", "club"];
let currentView = "plan";
function showView(v) {
  currentView = v;
  for (const k of VIEWS) {
    $("view-" + k).hidden = k !== v;
    $("tab-" + k).setAttribute("aria-selected", k === v);
    $("tab-" + k).tabIndex = k === v ? 0 : -1;
  }
  if (v === "saved") renderSaved();
  if (v === "club") renderClub();
}
function applyRole() {
  $("view-plan").classList.toggle("member", !S.isHost);
  $("tab-plan").textContent = S.isHost ? "Plan a meeting" : "This meeting";
  $("tab-saved").firstChild.textContent = S.isHost ? "Meetings " : "Schedule ";
  $("tab-club").textContent = S.isHost ? "Club" : "Bookshelf";
  document.querySelector(".brand").firstChild.textContent = clubName() + " ";
  const rest = document.querySelector(".brand-rest"); if (rest) rest.hidden = !S.isHost;
  if (currentView === "club") renderClub();
}
for (const k of VIEWS) $("tab-" + k).onclick = () => showView(k);
document.querySelector(".tabs").addEventListener("keydown", (e) => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const i = VIEWS.indexOf(currentView);
  const to = e.key === "Home" ? 0 : e.key === "End" ? VIEWS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length;
  showView(VIEWS[to]);
  $("tab-" + VIEWS[to]).focus();
});
$("form").addEventListener("submit", generate);
$("btn-stop").onclick = () => S.ctl?.abort();

// Keep jump targets and the sticky form below the real header height (it changes with the live bar).
{
  const top = document.querySelector(".top");
  const setSticky = () => document.documentElement.style.setProperty("--sticky", top.getBoundingClientRect().height + "px");
  setSticky();
  if (window.ResizeObserver) new ResizeObserver(setSticky).observe(top);
}

// ---------- Start: render from the embedded data right away ----------
function pickInitial() {
  const list = meetings();
  const cur = list.find(x => x.id === club().currentId);
  const viewing = list.find(x => x.id === ss.get("bc-viewing"));
  const m = (!S.follow && viewing) ? viewing : (cur || viewing || list[0]);
  if (m) { S.current = { ...m, guide: normalizeGuide(m.guide) }; S.isExample = false; fillNext(m); }
  else {
    // Nothing saved yet: no fake example. Members see a short note, the host sees the form first.
    S.current = null; S.isExample = false;
    fillForm({ meetingNumber: 1, minutes: 90 });
    $("form-hint").textContent = "Enter your book and the chapters for the first meeting, then tap Write the guide.";
  }
  S.unsaved = false;
}
pickInitial();
applyRole();
renderGuide(); renderSaved(); renderLivebar();
{
  const msg = ss.get("bc-msg"); if (msg) { setStatus(msg); ss.del("bc-msg"); }
}
if (club().now && isCurrentMeeting() && S.follow) setTimeout(() => scrollToSection(club().now), 120);

(async () => {
  if (PUBLIC || !window.claude?.use) { renderFooter(); return; }   // plain public view: read-only, nothing else to load
  const [artifact, user, sample, downloads, db] = await Promise.all([
    claude.use("artifact").catch(() => null), claude.use("user").catch(() => null),
    claude.use("sample").catch(() => null), claude.use("downloads").catch(() => null), claude.use("db").catch(() => null)
  ]);
  S.artifact = artifact; S.user = user; S.sample = sample; S.downloads = downloads; S.db = db;

  let edit = null, owner = null;
  if (user) {
    try { edit = await user.canEdit(); } catch {}
    try { owner = await user.isOwner(); } catch {}
  }
  // Host = the owner or an editor. Everyone else gets the read-only club view.
  // The planner is private to its owner, so inside Claude the viewer is the host unless the platform
  // explicitly says otherwise (someone the owner shared it with as view-only). The public copy never gets here.
  S.isHost = !(edit === false && owner === false);

  if (S.isHost) {
    // Restore an unsaved draft that a page update would otherwise have wiped.
    const draft = ss.get("bc-draft");
    if (draft) {
      try { S.current = { ...JSON.parse(draft) }; S.current.guide = normalizeGuide(S.current.guide); S.isExample = false; S.unsaved = true; fillForm(S.current); } catch { ss.del("bc-draft"); }
    }
    if (!sample) { $("btn-generate").disabled = true; $("ai-hint").textContent = "Claude isn't available in this view, so new guides can't be written."; }
  }
  applyRole();
  if (S.isHost) showUndo();   // offer Undo again after the page reloads from a delete
  if (S.isHost && S.db) withTimeout(mirrorToDb(S.data), 15000).catch(() => {});   // keep the sync copy current
  renderGuide(); renderSaved(); renderLivebar();
})();
</script>
